services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexinet
      POSTGRES_USER: lexinet
      POSTGRES_PASSWORD: lexinet
    volumes:
      - lexinet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexinet -d lexinet"]
      interval: 5s
      timeout: 3s
      retries: 20

  lexinet:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. Do not proxy this ordinary HTTP surface into a Tailnet.
      # Native Tailnet deployments use Lexinet's separate tsnet TLS listener on
      # fixed port 443 and a pre-enrolled owner-only state bind mount; see README.
      - "127.0.0.1:17892:17892"
    environment:
      LEXINET_CONFIG: /etc/lexinet/config.toml
    volumes:
      - ./config.toml:/etc/lexinet/config.toml:ro
      # Intentionally no tsnet state mount in this Tailnet-disabled profile.
      # A production override must bind-mount pre-enrolled, service-owned 0700
      # state at /var/lib/lexinet/tsnet-state; never put enrollment keys here.
    command: ["serve", "--bind", "0.0.0.0:17892", "--tailnet", "off"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lexinet", "--endpoint", "http://127.0.0.1:17892", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  lexinet-postgres:
