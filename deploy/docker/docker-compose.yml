services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexinet
      POSTGRES_USER: lexinet
      POSTGRES_PASSWORD: lexinet
    volumes:
      - lexinet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexinet -d lexinet"]
      interval: 5s
      timeout: 3s
      retries: 20

  lexinet:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # loopback ONLY — the VM cannot bind the host's tailscale address. Tailnet exposure is
      # bridged host-side by `tailscale serve --bg --tcp 17892 tcp://127.0.0.1:17892`
      # (tailnet-only, no LAN exposure; persisted by tailscaled across restarts).
      - "127.0.0.1:17892:17892"
    environment:
      LEXINET_CONFIG: /etc/lexinet/config.toml
    volumes:
      - ./config.toml:/etc/lexinet/config.toml:ro
    command: ["serve", "--bind", "0.0.0.0:17892", "--tailnet", "off"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/lexinet", "--endpoint", "http://127.0.0.1:17892", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  lexinet-postgres:
