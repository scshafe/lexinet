# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host. Infra's stacks/lexinet/host.conf
# grants what this file cannot (host paths, loopback ports, groups).
schema = 1

[deploy]
image = "lexinet"                  # the image built from this repository's Dockerfile
pin = "LEXINET_IMAGE"
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["lexinet", "lexinet-db"]
health = "/healthz"                  # TODO(infra#22): native nodes check the container healthcheck instead; set per the schema
ready_attempts = 20
rollback_services = ["lexinet"]

# NATIVE NODE (infra#22). Field names follow the owner's summary of the schema;
# verify against the comment on infra#22 before opening the PR.
[node]
mode = "native"
service = "lexinet"
hostname = "lexinet-study"
identity = "state/tsnet"
enroll = ["lexinet", "tailnet", "enroll", "--state-dir", "/var/lib/lexinet/tsnet-state", "--hostname", "lexinet-study"]

[check]
required_health_services = ["lexinet", "db"]

[backup]
tailscale = false                    # no sidecar; the node identity is state/tsnet
paths = ["state/tsnet"]              # the node identity (see [node] identity)
pg = { container = "lexinet-db", user = "lexinet", db = "lexinet" }

[env]
required = []
generated = ["LEXINET_DB_PASSWORD"]
owner = []
